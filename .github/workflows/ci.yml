name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Structure, references, i18n parity, translations
        run: python tools/verify.py

      - name: Translation files are up to date with the source
        run: |
          python tools/make_translations.py
          git diff --exit-code languages/ \
            || (echo "languages/ is stale - run: python tools/make_translations.py" && exit 1)

  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l every file
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPUnit
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpunit --testdox | tee phpunit.out

          # PHPUnit 9 exits 0 on an empty suite, so a passing job would
          # otherwise prove nothing. Require a real count.
          ran=$(grep -oE 'OK \(([0-9]+) test' phpunit.out | grep -oE '[0-9]+' | head -1)
          if [ -z "$ran" ]; then
            echo "::error::PHPUnit printed no 'OK (n tests)' line - the suite did not complete."
            exit 1
          fi
          if [ "$ran" -lt 50 ]; then
            echo "::error::Only $ran tests ran; expected at least 50. Did a test file stop being collected?"
            exit 1
          fi
          echo "$ran tests ran."

  js:
    name: JS and CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check the scripts
        run: |
          node --check assets/admin.js
          node --check assets/frontend.js

      - name: Stylesheets balance
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['assets/admin.css', 'assets/frontend.css']) {
              const css = fs.readFileSync(f, 'utf8');
              let depth = 0;
              for (const c of css) { if (c === '{') depth++; if (c === '}') depth--; }
              if (depth !== 0) { console.error(f + ': unbalanced braces (' + depth + ')'); process.exit(1); }
              console.log(f + ': balanced');
            }
          "
